server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源（带 hash，长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 登录 / 令牌 / 公钥端点 → iam Service（正则 location 优先于下面的前缀 location）
    location ~ ^/hisilicon-knowledge/(user/(login|refresh|logout)|publicKey)$ {
        rewrite ^/hisilicon-knowledge/(.*)$ /hisilicon-knowledge-iam/$1 break;
        proxy_pass http://hisilicon-knowledge-iam-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # tus 分片上传：tus 路径单独加长等待、关掉缓冲，避免 PATCH 还在处理就被 Nginx 掐成 502
    location /hisilicon-knowledge/kb/documents/tus {
        proxy_pass http://hisilicon-knowledge-core-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_max_body_size 100m;
    }

    # API 反向代理 → 后端 core Service（同 namespace，简写即可）
    location /hisilicon-knowledge/ {
        proxy_pass http://hisilicon-knowledge-core-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # SSE 流式问答需要较长超时
        proxy_buffering off;       # SSE 需要关闭缓冲
        client_max_body_size 101m; # 文件上传大小限制，留了 1MB 余量给 multipart 开销
    }

    # MCP 网关反向代理 → mcp-gateway Service（集群内 8080 端口）
    # 前缀比 /hisilicon-knowledge/ 更长，nginx 最长前缀匹配会优先命中本条
    location /hisilicon-knowledge-mcp {
        proxy_pass http://hisilicon-knowledge-mcp-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;   # MCP SSE 流式响应需要较长超时
        proxy_send_timeout 300s;
        proxy_buffering off;       # SSE 需要关闭缓冲
    }

    # OIDC 回调（带 API 前缀的实际回调路径）→ iam Service
    # 前缀比 /hisilicon-knowledge/ 更长，nginx 最长前缀匹配会优先命中本条
    location /hisilicon-knowledge/oidc {
        rewrite ^/hisilicon-knowledge/oidc(.*)$ /hisilicon-knowledge-iam/oidc$1 break;
        proxy_pass http://hisilicon-knowledge-iam-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }

    # SPA 路由回退
    location / {
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}