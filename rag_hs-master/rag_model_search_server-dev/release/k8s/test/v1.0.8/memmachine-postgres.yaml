    spec:
      volumes:
        - name: memmachine-pg-data
          persistentVolumeClaim:
            claimName: memmachine-pg-data
      containers:
        - name: memmachine-postgres
          image: swr.cn-south-1.myhuaweicloud.com/hisilicon-rag/pgvector:pg16
          env:
            - name: PAAS_APP_NAME
              value: memmachine-postgres
            - name: PAAS_NAMESPACE
              value: default
            - name: PAAS_PROJECT_ID
              value: 57dba659283c4cfda3632e06e6f8097c
            - name: POSTGRES_DB
              value: memmachine
            - name: POSTGRES_USER
              value: memmachine
            - name: POSTGRES_PASSWORD
              value: memmachine_password
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: memmachine-pg-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - '-c'
                - pg_isready -U memmachine -d memmachine
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
