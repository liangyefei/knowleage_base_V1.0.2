      annotations:
        redeploy-timestamp: '1787013300408'
    spec:
      volumes:
        - name: config
          configMap:
            name: memmachine-config
            defaultMode: 420
        - name: logs
          emptyDir: {}
      containers:
        - name: memmachine
          image: swr.cn-south-1.myhuaweicloud.com/hisilicon-rag/memmachine:v1.0
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: memmachine-postgres
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_USER
              value: memmachine
            - name: POSTGRES_PASSWORD
              value: memmachine_password
            - name: POSTGRES_DB
