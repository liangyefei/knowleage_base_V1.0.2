            - name: NEO4J_HOST
              value: memmachine-neo4j
            - name: NEO4J_PORT
              value: '7687'
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              value: neo4j_password
            - name: MEMORY_CONFIG
              value: /app/configuration.yml
            - name: MEMMACHINE_WORKERS
              value: '1'
            - name: HOST
              value: 0.0.0.0
            - name: LOG_LEVEL
              value: INFO
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /app/configuration.yml
              subPath: configuration.yml
            - name: logs
              mountPath: /tmp/memory_logs
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 1
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 20
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
