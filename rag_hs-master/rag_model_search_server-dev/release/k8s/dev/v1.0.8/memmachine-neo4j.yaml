spec:
  replicas: 1
  selector:
    matchLabels:
      app: memmachine-neo4j
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: memmachine-neo4j
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memmachine-neo4j-data
        - name: plugins
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: import
          emptyDir: {}
      containers:
        - name: memmachine-neo4j
          image: swr.cn-south-1.myhuaweicloud.com/hisilicon-rag/neo4j:5.26.4-community
          ports:
            - containerPort: 7474
              protocol: TCP
            - containerPort: 7687
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              value: neo4j/neo4j_password
            - name: NEO4J_PLUGINS
              value: '["apoc","graph-data-science"]'
            - name: NEO4J_server_memory_heap_initial__size
              value: 512m
            - name: NEO4J_server_memory_heap_max__size
              value: 1G
            - name: NEO4J_server_default__listen__address
              value: 0.0.0.0
            - name: NEO4J_server_bolt_listen__address
              value: 0.0.0.0:7687
            - name: NEO4J_server_http_listen__address
              value: 0.0.0.0:7474
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
            - name: logs
              mountPath: /logs
            - name: import
              mountPath: /var/lib/neo4j/import
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            timeoutSeconds: 1
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 20
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
