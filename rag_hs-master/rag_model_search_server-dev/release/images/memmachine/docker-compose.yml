# =============================================================================
# MemMachine Docker Compose 编排
#
# 三服务架构（见 MemMachine.md §3、§9.1）：
#   1. postgres   pgvector/pgvector:pg16  — 语义/Profile 记忆存储（PostgreSQL + pgvector）
#   2. neo4j      neo4j:5.23-community   — 情景记忆图存储（含 APOC + GDS 插件）
#   3. memmachine 本地构建镜像            — MemMachine 服务（REST API v2 + MCP，端口 8080）
#
# 构建上下文 = 项目根（context: ../../..），Dockerfile 在 release/images/memmachine/Dockerfile
#
# 启动：bash deploy.sh   或   docker compose up -d --build
# 停止：bash stop.sh     或   docker compose down
# 清理：docker compose down -v（删除容器与数据卷）
# =============================================================================

services:
  # ── PostgreSQL with pgvector（语义/Profile 记忆存储）─────────────────
  postgres:
    # image: pgvector/pgvector:pg16
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg16
    container_name: memmachine-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memmachine}
      POSTGRES_USER: ${POSTGRES_USER:-memmachine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memmachine_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 探测 PostgreSQL 是否可接受连接
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memmachine} -d ${POSTGRES_DB:-memmachine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - memmachine-network

  # ── Neo4j（情景记忆图存储，含 APOC + GDS 插件）──────────────────────
  neo4j:
    # image: neo4j:5.23-community
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/neo4j:5.26.4-community
    container_name: memmachine-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP（Neo4j Browser）
      - "${NEO4J_HTTPS_PORT:-7473}:7473"  # HTTPS
      - "${NEO4J_PORT:-7687}:7687"        # Bolt 协议（客户端连接）
    environment:
      NEO4J_EDITION: community
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      # 调优：Bolt 线程池上限、堆内存
      NEO4J_server_bolt_thread__pool__max__size: 2000
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      # 监听所有网卡（容器内必须）
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      NEO4J_server_https_listen__address: 0.0.0.0:7473
      # 加载 APOC + Graph Data Science 插件（情景记忆图查询依赖）
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      # cypher-shell 执行 RETURN 1 验证 Neo4j 可查询
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - memmachine-network

  # ── MemMachine 服务（REST API v2 + MCP）──────────────────────────────
  memmachine:
    build:
      context: ../../..                   # 构建上下文 = 项目根（含 open_source/memmachine/ 源码 + release/images/memmachine/ 部署文件）
      dockerfile: release/images/memmachine/Dockerfile
      args:
        GPU: ${GPU:-false}                # 是否构建 GPU 版本（含 sentence-transformers 本地 embedding）
        SCM_VERSION: ${SCM_VERSION:-0.0.0}
    image: haisi-memmachine:${IMAGE_TAG:-cpu}
    container_name: memmachine-app
    restart: unless-stopped
    ports:
      - "${MEMORY_SERVER_PORT:-8080}:8080"
    environment:
      # PostgreSQL 连接（服务发现：容器名 postgres）
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-memmachine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memmachine_password}
      POSTGRES_DB: ${POSTGRES_DB:-memmachine}

      # Neo4j 连接
      NEO4J_HOST: ${NEO4J_HOST:-neo4j}
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}

      # 应用配置
      MEMORY_CONFIG: ${MEMORY_CONFIG:-/app/configuration.yml}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://memmachine:8080}
      GATEWAY_URL: ${GATEWAY_URL:-http://localhost:8080}
      FAST_MCP_LOG_LEVEL: ${FAST_MCP_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # LLM / Embedding API Key（configuration.yml 中以 $ENV 语法引用）
      GLM_API_KEY: ${GLM_API_KEY:-}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      MEMMACHINE_WORKERS: ${MEMMACHINE_WORKERS:-1}
      MEMMACHINE_CONFIG_API: ${MEMMACHINE_CONFIG_API:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
    volumes:
      # 配置文件通过 volume 挂载，便于在宿主机修改无需重建镜像
      - ./configuration.yml:/app/configuration.yml:rw
      # 日志与 SQLite 向量索引持久化
      - memmachine_logs:/tmp/memory_logs
      - memmachine_event_vectors:/tmp/event_vector_indexes
      - memmachine_semantic_vectors:/tmp/semantic_vector_indexes
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      # 调用 /api/v2/health（见 MemMachine.md §14）
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - memmachine-network
    # 允许容器访问宿主机服务（如本机 Ollama）
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ── 数据卷（持久化）──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  memmachine_logs:
    driver: local
  memmachine_event_vectors:
    driver: local
  memmachine_semantic_vectors:
    driver: local

# ── 网络 ─────────────────────────────────────────────────────────────
networks:
  memmachine-network:
    driver: bridge
    name: memmachine-network
