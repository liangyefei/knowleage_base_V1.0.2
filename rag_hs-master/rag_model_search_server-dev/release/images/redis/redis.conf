# ============================================
# Redis 配置文件
# 文档参考: https://redis.io/topics/config
# ============================================

# --------------------------------------------
# 网络配置
# --------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300
daemonize no

# --------------------------------------------
# 安全配置
# --------------------------------------------
requirepass farai123

# --------------------------------------------
# 日志配置
# --------------------------------------------
loglevel notice
logfile ""

# --------------------------------------------
# 持久化配置 - AOF (Append Only File)
# --------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --------------------------------------------
# 持久化配置 - RDB 快照
# --------------------------------------------
save 60 1000
save 300 10
save 60 10000

# --------------------------------------------
# 内存管理（根据服务器配置调整）
# --------------------------------------------
# maxmemory 2gb
# maxmemory-policy allkeys-lru

# --------------------------------------------
# 连接数配置
# --------------------------------------------
maxclients 10000

# --------------------------------------------
# 慢查询日志
# --------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
