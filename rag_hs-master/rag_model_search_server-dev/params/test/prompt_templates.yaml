       - 规则B：基于语义和内容长度 → 简短概括性的行分配适当层级
       - 规则C：基于视觉缩进 → 缩进越深，层级越低

    **页码标记规则（极其重要）**：
    1. **每页开头必须标注页码**：`[Page N]`（N为PDF实际页码）
