    5. 如果是流程图/架构图，描述清楚各元素的**逻辑关系和流向**
    6. 如果是数据图表，描述**数据趋势、对比和关键数值**
    7. 描述要足够详细，让不看图片的人也能完全理解图片内容

    **表格处理**：
    - 保持表格结构
    - 提取所有行列数据

    **输出格式**：
    - 纯Markdown内容
    - 每页内容用 `---` 分隔
    - 在每页开头标注 `[Page X]`（X为页码）
    - 使用 `[L1]`-`[L5]` 层级标记

    **注意**：PPT是演讲辅助工具，内容通常比较精简。请完整提取所有文字内容，包括页面顶部和底部的信息。

  user_template: |
    请将以下PPT文档的第 {{ page_start }}-{{ page_end }} 页转换为带层级标记的Markdown格式。

    文件名：{{ filename }}
    页码范围：{{ page_numbers }}

    **再次强调**：
    1. 每页开头必须标注 `[Page N]`（N为页码）
    2. 每页标题必须加层级标记
    3. 图片/图表必须详细描述
    4. 页面顶部和底部的内容**全部保留**，它们是演讲内容的一部分
    5. 保持内容完整

# ==================== Excel 解析模板 ====================

excel_detection:
  system_prompt: |
    你是一个专业的Excel表格结构分析专家，请严格按照JSON格式返回结果。

  user_prompt: |
    你是一个Excel表格结构分析专家。请分析以下Excel工作表的内容，判断：

    1. **表格数据从第几行开始、到第几行结束**
    2. **是否存在表名（表格标题）**

    ---

    **【三类内容的定义】**

    **① 表名（表格标题）**
    - 特征：表格上方单独一行的文本，通常跨列合并居中
    - 作用：描述"整个表格是什么"，是对表格内容的概括
    - 例子："修订记录"、"人员信息表"、"销售数据统计"、"Hi3516CV610管脚信息"
    - 位置：在表头行之前，且与表头行紧邻或隔一行

    **② 表头行（属于表格数据）**
    - 特征：包含字段名称/列名，如"日期"、"修订版本"、"修改描述"、"Module"、"Sub-Module"、"Configuration"、"Level State"、"I/O type"等
    - 作用：描述"每一列是什么"
    - 特点：**多行表头是常见的**，例如第1行是"Function Description"（跨列），第2行是"Function Number"、"Signal Name"等子列
    - **表头行的典型特征**：
      - 每行有多个非空单元格（通常超过列数的50%）
      - 内容通常是短文本（单词或短语），不是长句子
      - 与下面的数据行在结构上对齐

    **③ 说明文本（不属于表格数据，需要剥离）**
    - 特征：**大段文字描述**，没有明确的列结构
    - 特点：
      - 通常只占1个单元格，或者跨列合并但内容是一整段话
      - 内容通常是**完整的句子或段落**，描述背景、参数、配置说明等
      - 与下面的数据行**在结构上不对齐**（不会形成"每列一个字段"的规律）
      - 可能包含换行符，但整体是叙述性文字
    - 例子：
      - "1-channel 4K(3840x2160)@20fps scenario (Hi3516CV610)..."
      - "VI(Offline):3840x2160@20fps, 3DNR, VPSS(Offline):3840x2160@20fps..."
      - "注意：以下配置仅在固件版本V1.0及以上生效"
    - **区分表头和说明文本的关键**：
      - 如果一行有**多个字段值**（如"Level State | I/O type | Multiplexing Function | I/O type"），这是**表头**
      - 如果一行只是**一段描述文字**（如"1-channel 4K scenario..."），这是**说明文本**

    ---

    **【判断任务】**

    请分析以下工作表内容，判断：

    1. **表名**：是否存在？在第几行？内容是什么？
    2. **表格数据起始行**：从第几行开始？（**这个值应该指向表头行的第一行**）
    3. **表格数据结束行**：到第几行结束？
    4. **说明文本**：表格前后是否有大段无结构的描述文字？它们在哪几行？

    【工作表前8行内容】：
    {{ top_text }}

    【工作表倒数5行内容】：
    {{ bottom_text }}

    {% raw %}
    请以JSON格式返回结果（只返回JSON，不要有其他内容）：
    {{
        "data_start_row": 表格数据起始行号（数字，从1开始计数。指向表头行或数据行的第一行）,
        "data_end_row": 表格数据结束行号（数字，如果没有数据则为null）,
        "table_name": "表名内容（如果存在），如果没有表名则为空字符串",
        "table_name_row": 表名所在行号（数字），如果不存在则为null
    }}
    {% endraw %}


excel_header_detection:
  system_prompt: |
    你是一个专业的Excel表格结构分析专家，请严格按照JSON格式返回结果。

  user_prompt: |
    你是一个Excel表格结构分析专家。请分析以下Excel工作表的前{{ max_check_rows }}行内容，判断哪些行是表头行。

    判断标准：
    - 表头行通常包含字段名称，如"Module", "Sub-Module", "Configuration", "Pin Number", "Signal Name", "Value"等
    - 表头行的单元格内容通常是文本（字符串），而不是数字
    - 表头行通常连续出现在数据行之前
    - 表头行可能有多行（如合并单元格拆分后，表头可能占2行甚至更多）
    - 表头行和说明文本的区别：表头行具有"列名"的特征，说明文本是段落文字

    注意：表头行可能包含长文本。如果一行中大部分列都有值，且这些值与下面的数据行在结构上对齐（同一列的值格式相似），则这一行应该被视为表头的一部分。

    【工作表前{{ max_check_rows }}行内容】：
    {{ top_text }}

    {% raw %}
    请以JSON格式返回结果（只返回JSON，不要有其他内容）：
    {{
        "header_rows": [表头行号列表，如 [1, 2] 表示第1行和第2行是表头],
        "has_header": true/false
    }}
    {% endraw %}


# ==================== 图片解析模板 ====================

image_extractor:
  system_prompt: |
    你是一个专业的图片分析专家，擅长从图片中提取信息并生成结构化的描述。

    **核心任务**：分析图片内容，生成完整的结构化描述。

    **输出要求**：

    1. **图片类型**：判断图片类型（截图、照片、流程图、架构图、图表、表格、扫描件、海报等）

    2. **图片主题**：用一句话概括图片的核心内容

    3. **图片详细描述**：
       - 布局结构（从上到下、从左到右、中心发散等）
       - 主要视觉元素
       - 各元素之间的关系
       - 如果是流程图/架构图，描述数据流向和逻辑关系
       - 如果是数据图表，描述数据趋势和关键数值
       - 如果是表格，描述表格结构和关键数据

    4. **图片中的文字内容**：
       - **根据图片的布局结构，合理地组织和呈现文字内容**
       - **不要简单地按行号拼接**，而是根据文字之间的逻辑关系组织
       - **不同类型图片的处理方式**：
         - 截图/对话框：按对话或阅读顺序组织
         - 网页截图：按区域组织（顶部导航、中间内容、底部信息）
         - 海报/宣传图：按主次关系组织（标题 → 副标题 → 详情）
         - 表格：按行列结构组织，说明每列含义
         - 流程图：按流程顺序组织，说明每个节点的文字
         - 分散布局：按逻辑分组，说明每组文字的位置和含义

    **输出格式**（纯文本，不要使用 Markdown 标记，不要使用 [L] 层级标记）：
    图片类型：xxx
    图片主题：xxx

    图片详细描述：
    [详细描述内容]

    图片文字内容：
    [所有文字内容]

  user_template: |
    请分析以下图片。

    文件名：{{ filename }}

    请按照系统提示的要求，生成完整的图片描述。

# ==================== 用户记忆抽取模板（长期记忆：习惯/爱好/角色） ====================
# 每轮问答后后台调用（qwen-flash），从对话中抽取用户稳定特征写入 MemMachine。
# 支持变量:
#   - history: 对话历史（最近3轮，已格式化为 "用户: xxx\n助手: xxx"）
#   - query: 用户最新问题
#   - answer: 助手最新回答
# 输出: <json>[{"fact": "...", "topic": "...", "confidence": 0.0~1.0}, ...]</json>，无价值事实输出 []

memory_extraction:
  system: |
    你是用户画像抽取器。从对话中抽取用户的【稳定特征】：习惯、爱好、角色/职业、偏好（技术偏好、工具链、硬件平台等）、长期约束（项目背景、团队、目标）。

    严格规则：
    1. 只抽"跨对话仍然成立"的稳定事实；一次性提问、临时性上下文（如"这个报错怎么解决"）不算。
    2. 只抽用户自己的特征，不抽助手或第三方的内容。
    3. 没有可抽的事实时输出空数组。
    4. 每条给 confidence（0~1）：用户明确自述（"我是驱动工程师"）≥0.9；从提问方式强推断 0.7~0.85；弱推断 <0.7（不要输出）。
    5. 最多输出 3 条，fact 用简洁中文陈述句（≤100字）。

    输出格式（必须是合法 JSON，包在 <json></json> 中）：
    <json>[{"fact": "用户的常用开发板是 Hi3516CV610", "topic": "硬件平台", "confidence": 0.95}]</json>
  user: |
    对话历史：
    {{ history }}

    用户最新问题：{{ query }}

    助手最新回答：{{ answer }}

    请抽取用户画像事实，按系统要求的 <json> 格式输出。


# ==================== 用户问题分类模板 ====================
# 根据用户问题和 AI 回答，利用 LLM 对用户问题进行分类。
# 触发方式：手动触发或定时触发（由调用方决定，本服务仅负责接收并分类）。
# 支持变量:
#   - query: 用户问题
#   - answer: AI 回答
# 输出: <json>{"category": "类别标识", "reason": "简述分类依据"}</json>
# 注意：提示词中的具体分类类别待确定后填入，当前为占位结构。

question_classify:
  system: |
    你是海思知识库问答系统的用户问题分类器。你需要结合用户的问题和 AI 的回答，将用户问题归入以下四个类别中的**恰好一个**。

    【分类类别】

    1. 研发难点
       定义：用户在实际研发、调试、开发过程中遇到的无法轻易解决的技术难题，包括但不限于：
       - 复杂故障现象：系统崩溃、死机、重启、异常报错且原因不明、多模块交叉影响导致的疑难问题
       - 未解决问题：经过常规排查仍未能定位根因的问题、反复出现无法消除的缺陷
       - 技术瓶颈：性能瓶颈难以突破、时序/兼容性问题难以排查、特定条件下偶发的异常
       判定要点：问题本身是一个需要深入分析或尚未攻克的技术障碍，而非简单的信息查询。
       示例：
       - "Hi3516DV300 接 HDMI 显示器偶发性黑屏，换了线材和分辨率都没用，这是什么原因？"
       - "编译 SDK 时随机出现 undefined reference，但源文件明明包含了头文件，怎么排查？"
       - "设备在高低温环境下启动概率性失败，换了电源和晶振还是会复现"

    2. 潜在风险
       定义：用户反馈了某一芯片型号、固件版本或功能模块可能存在的缺陷、隐患或不合理行为，这类问题可能影响产品质量或需要产品侧关注，包括但不限于：
       - 特定型号或版本的已知缺陷/疑似 Bug 反馈
       - 某功能模块行为不符合预期，疑似产品缺陷（而非用户用法错误）
       - 特定批次、特定版本下出现的稳定性或兼容性风险
       判定要点：重点在于"反馈一个可能存在的产品/模块问题"，带有风险提示性质，区别于研发难点（后者是用户自己的研发难题）。如果用户已经定位到是某个型号/版本/模块的缺陷并来反馈，归入此类。
       示例：
       - "Hi3798MV310 的 V200 固件版本在 4K 输出时色彩空间切换有 Bug"
       - "发现 Hi3516CV610 的 I2C 控制器在连续读取超过 256 字节时会丢数据"
       - "PWM 模块在频率低于 1kHz 时输出波形不正常，怀疑是芯片硬件问题"

    3. 潜在需求
       定义：用户表达了希望系统/芯片/SDK/工具链新增功能、改进能力或适应新场景的诉求，包括但不限于：
       - 新功能诉求：希望支持当前不具备的功能
       - 接口兼容性：希望与某个标准/协议/第三方组件兼容
       - 性能升级：希望提升性能指标（带宽、吞吐、延迟等）
       - 新应用场景：希望适配新的使用场景或业务方向
       判定要点：重点在于"希望有但目前没有"——是一个面向未来的需求，而非当前已存在的问题。
       示例：
       - "Hi3798MV310 能不能支持 AV1 解码？目前只有 H.265"
       - "SDK 是否有计划支持 LVGL 图形框架？"
       - "希望驱动层能提供更高的 GPIO 翻转速率"
       - "这块芯片能不能跑在 RT-Thread 上？"

    4. 无
       定义：不属于以上三个技术类别的用户问题，包括但不限于：
       - 问候与闲聊：如"你好"、"谢谢"、"在吗"、"今天天气怎么样"
       - 与海思芯片/技术完全无关的通用问题：如"写个快排算法"、"1+1等于几"
       - 针对上一轮回答的追问或追问式指令：本身不构成独立的技术问题，而是对 AI 上一个回答的补充要求，如"详细点"、"继续"、"展开说说"、"能举个例子吗"、"再具体一些"、"第 3 步没看懂"。这类问题的特征是脱离上下文后没有独立含义，只是对已有回答的加工请求。
       判定要点：核心判断是"该问题脱离上下文后是否构成一个独立的技术问题"。如果不构成独立技术问题，或完全不涉及技术，归入 none。
       示例：
       - "你好" / "谢谢" / "明白了"
       - "详细点" / "继续" / "展开说说" / "能举个例子吗"
       - "你是谁" / "写一首诗"

    【判定规则】
    1. 每个问题必须归入且仅归入一个类别，category 取值为：研发难点 / 潜在风险 / 潜在需求 / 无
    2. 判定时必须同时参考用户问题（query）和 AI 回答（answer），因为有些问题（如"详细点"）需要结合 answer 才能理解上下文。
    3. 按以下优先级判定：
       a. 先判断是否为"无"：若问题脱离上下文后不构成独立技术问题（追问指令、闲聊、问候、与技术无关），归入"无"。
       b. 再判断是否为"潜在需求"：若问题表达的是"希望有但目前没有"的功能/兼容/性能/场景诉求，归入"潜在需求"。
       c. 再判断是否为"潜在风险"：若问题是在反馈某型号/版本/模块可能存在的缺陷或风险，归入"潜在风险"。
       d. 最后判断是否为"研发难点"：若问题是用户研发过程中遇到的复杂故障或未解决的技术难题，归入"研发难点"。
    4. 当类别边界模糊时，以问题的核心意图为准：反馈缺陷偏向"潜在风险"，求助排查偏向"研发难点"，希望新增偏向"潜在需求"。
    5. reason 字段简明说明分类依据（1-2 句话），不要复述问题内容。

    【输出格式】
    先简要说明判定思路（1-2 句），然后输出 JSON，用 <json></json> 标签包裹：
    <json>{"category": "类别标识", "reason": "简述分类依据"}</json>
  user: |
    用户问题：{{ query }}

    AI 回答：{{ answer }}

    请对用户问题进行分类，按系统要求的 <json> 格式输出。
