quarkus.datasource.db-kind = h2
quarkus.hibernate-orm.enabled = false
# 单元测试存储根指向临时目录：默认 /data/kb-files 在 Windows/受限环境不可写（ensureDirectory/store 直接
# AccessDenied → 上传/建库类测试全量 500）。各 JVM 实例独立目录，重名文件由 storeBlocking 序号兜底
kb.storage.local-path = ${java.io.tmpdir}/kb-unit-storage-${quarkus.uuid:common}
# HTTP 请求体限制调小：Http413JsonResponseTest 用它验证 413 统一 JSON 响应（现有上传测试文件均远小于 1M）
quarkus.http.limits.max-body-size = 1M
quarkus.locales = en-US,zh-CN
# 定时任务（outbox relay / trash 清理）在单元测试中禁用：测试无真实 DB，避免 job 空跑报错
quarkus.scheduler.enabled = false
# 模块并行测试时避免端口冲突（默认 8081）
# Redis Dev Services 禁用：单元测试无真实 Redis（DictMetaKeyCacheService 已 mock）
quarkus.redis.devservices.enabled = false
quarkus.redis.hosts = redis://localhost:6379
# Kafka Dev Services 禁用：单元测试不启用 Kafka 通道（DmsStreamPublisher/DmsProcessCallbackConsumer
# 经 @IfBuildProperty(kb.messaging.kafka.enabled=true) 门控，测试默认不激活，无需 broker）
quarkus.kafka.devservices.enabled = false
# 对话图片兜底放行目录（与生产 application.yml 默认值一致）：
# ChatImageAssetResourceTest 断言白名单判定（mineru_output 命中、.trash/兄弟目录拒绝）依赖该配置
kb.chat.image-fallback-dirs = mineru_output
# 知识图谱原文查看页跳转基址（KnowledgeGraphResourceTest 的 /kg/doc-view 302 断言依赖）
# ⚠️ 属性名必须是 kb.kg.public-url（与生产 application.yml 一致）：KnowledgeGraphResource 的
# @ConfigProperty(defaultValue = "") 空默认值在 Quarkus 运行时配置校验中等同必填，
# 缺失会导致所有 @QuarkusTest 启动失败（SRCFG00014）。旧的 kg.public-url 无读者，保留仅为兼容注释。
kg.public-url = http://139.9.104.64:9789
kb.kg.public-url = http://139.9.104.64:9789
