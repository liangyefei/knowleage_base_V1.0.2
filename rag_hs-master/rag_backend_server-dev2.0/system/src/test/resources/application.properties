quarkus.datasource.db-kind = h2
quarkus.hibernate-orm.enabled = false
quarkus.redis.devservices.enabled = false
# quarkus-oidc 在测试 classpath 上时会默认拉起 Keycloak Dev Services（需要 Docker / 拉镜像），
# 本模块测试不依赖 OIDC 容器，全局关掉 dev services，避免无 Docker 环境下测试挂起。
quarkus.devservices.enabled = false
quarkus.redis.hosts = redis://localhost:6379/0
quarkus.locales = en-US,zh-CN
# 关闭 proactive 认证：与生产配置一致（proactive=false），
# 避免 smallrye-jwt 机制提前拦截 Bearer 头（无效签名直接 401），
# 让 commons-web AuthenticationFilter 统一处理（抛 A0301 → HTTP 200）
quarkus.http.auth.proactive = false
# 模块并行测试时避免端口冲突（system 模块用 8082）
quarkus.http.test-port = 8082
# 测试期没有真实的 OneAccess 租户：彻底关闭 OIDC 租户，避免 TenantContextFactory 因缺少
# auth-server-url 抛 ConfigurationException（生产由 hisilicon-knowledge-iam-service 注入）。
quarkus.oidc.tenant-enabled = false
