# ============================================================
# ValidationMessages.properties — 全项目 Bean Validation 校验消息
# 集中管理原因：knowledge/system 模块各自持有同名 ValidationMessages.properties
# 时，打包后 classpath 同名资源只有一个生效（依赖顺序在前者遮蔽后者），
# 被遮蔽模块的 {app.xxx} 消息 key 无法解析、原样输出（2026-08 实战）。
# 约定：所有模块的校验消息 key 统一放这里，模块内不再放同名文件。
# ============================================================

# 知识库参数校验
app.kb.name.notblank=知识库名称不能为空
app.kb.id.notblank=知识库ID不能为空

# 类别参数校验
app.category.name.notblank=类别名称不能为空
app.category.id.notblank=类别ID不能为空

