# hisilicon-knowledge-core-service 冒烟测试配置：只验证"服务能独立启动 + 路由归属"，不连真实 DB/Redis/Kafka。
#
# ⚠️ 这里**故意不把 datasource 改成 h2**（与 knowledge/llm 库模块的测试配置不同）：
#    本模块的 application.yml 已配好 db-kind=postgresql + reactive.url，而 classpath 上只有
#    reactive-pg-client、没有 reactive h2 客户端；改成 db-kind=h2 反而会让 datasource 构建失败。
#    这里靠 hibernate-orm.enabled=false + 关 devservices，让连接池保持惰性、从不真正连接。
quarkus.hibernate-orm.enabled = false
quarkus.devservices.enabled = false
quarkus.redis.devservices.enabled = false
quarkus.kafka.devservices.enabled = false
# 定时任务（outbox relay / trash 清理 / 内容回填）无真实 DB，测试期关掉避免空跑报错
quarkus.scheduler.enabled = false
quarkus.locales = en-US,zh-CN
# 存储根指向临时目录：默认 /data/kb-files 在 Windows/受限环境不可写（建目录直接 AccessDenied）
kb.storage.local-path = ${java.io.tmpdir}/kb-core-smoke-${quarkus.uuid:common}
# 与其它模块的测试端口错开（knowledge 8081 / system 8082 / llm 8084 / iam 8088）
quarkus.http.test-port = 8087
# 管理接口（探针）独立端口：主 yml 里 quarkus.management.enabled=true，
# 测试期同样启用，但两个服务的测试 JVM 不能都抢默认的 9001，显式错开。
# 本服务测试期探针 = http://localhost:9007/q/health
quarkus.management.test-port = 9007
