quarkus.datasource.db-kind = h2
quarkus.hibernate-orm.enabled = false
quarkus.locales = en-US,zh-CN
# 模块并行测试时避免端口冲突（llm 模块用 8084）
quarkus.http.test-port = 8084
# HTTP 请求体上限调大：会话文件测试传 11MB（业务上限 10M 之后由 kb.upload.chat-max-file-size 拦截）
quarkus.http.limits.max-body-size = 100M
# 表单属性上限与生产对齐（服务模块 application.yml 同为 500M；默认 2048 字节会把超长标题
# 测试请求在 HTTP 层拦成 413，覆盖不到业务层截断逻辑）
quarkus.http.limits.max-form-attribute-size = 500M
# Kafka Dev Services 禁用（与 knowledge 一致）
quarkus.kafka.devservices.enabled = false
# Redis Dev Services 禁用：commons-dict 传递 redis client 依赖，
# 不关会触发 Testcontainers 拉 ryuk 镜像失败（本地无 docker daemon）
quarkus.redis.devservices.enabled = false
quarkus.redis.hosts = redis://localhost:6379
# 模型服务 REST Client 基址（隔离 :llm:test 时不加载 service 模块的 application.yml，
# 需在此补齐 rest-client url，否则 @ConfigProperty 注入与 @RegisterRestClient 代理构建校验失败；
# 测试用 Mock 替换 ModelServiceClient/KnowledgeGraphClient/DocumentChunkClient，
# 不会真连这些地址，本地默认值仅满足配置校验）
quarkus.rest-client.model-service.url = http://localhost:7860
quarkus.rest-client.kg-service.url = http://localhost:9789
