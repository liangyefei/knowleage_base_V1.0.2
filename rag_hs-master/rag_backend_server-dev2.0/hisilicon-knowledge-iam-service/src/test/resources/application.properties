# hisilicon-knowledge-iam-service 冒烟测试配置：只验证"身份域能独立启动 + 路由归属"。
#
# ⚠️ 同 hisilicon-knowledge-core-service：**故意不把 datasource 改成 h2**。本模块的 application.yml 已配
#    db-kind=postgresql + reactive.url，classpath 上只有 reactive-pg-client；
#    靠 hibernate-orm.enabled=false + 关 devservices 让连接池保持惰性。
quarkus.hibernate-orm.enabled = false
quarkus.devservices.enabled = false
quarkus.redis.devservices.enabled = false
quarkus.locales = en-US,zh-CN
# 与其它模块的测试端口错开（knowledge 8081 / system 8082 / llm 8084 / core 8087）
quarkus.http.test-port = 8088
# 管理接口（探针）独立端口：主 yml 里 quarkus.management.enabled=true，
# 测试期同样启用，显式与 core 的 9007 错开（默认 9001 会被两个服务同时占用）。
# 本服务测试期探针 = http://localhost:9008/q/health
quarkus.management.test-port = 9008
