# MCP gateway auth/quota messages (English)
# Kept in the platform messages/ layout, but the gateway does not depend on commons-i18n
# (it would transitively pull quarkus-rest, rest-qute, hibernate-validator and mapstruct).
# Each message tells the user what to do next, not just that something failed.

mcp.auth.missing=No MCP access token provided. Send the header Authorization: Bearer <token>; tokens are issued on the platform MCP Tokens page.
mcp.auth.invalid=The MCP access token is invalid (signature verification failed). Make sure it was issued by this platform, and re-issue it on the platform MCP Tokens page if needed.
mcp.auth.expired=The MCP access token has expired. Re-issue it on the platform MCP Tokens page and update the Authorization header in your MCP client configuration.
mcp.auth.typeMismatch=This token is not an MCP token (the type claim must be mcp). Issue a dedicated MCP token on the platform MCP Tokens page instead of reusing a login token.
mcp.auth.claimsMissing=The MCP access token lacks required claims (sub/jti), so the identity cannot be resolved. Re-issue it on the platform MCP Tokens page.
mcp.auth.revoked=The MCP access token has been revoked. Re-issue it on the platform MCP Tokens page.
mcp.auth.forbidden=This endpoint is restricted to system administrators (sys_admin).
mcp.auth.backendUnavailable=MCP authorization is temporarily unavailable (token verification or revocation check failed). Retry later, and contact the administrator if it keeps failing.
mcp.quota.exceeded=Today MCP quota is exhausted (daily limit {0,number,#} calls / {1,number,#} returned characters). The quota resets daily at 00:00 (UTC+8), or ask the administrator to raise the limit.