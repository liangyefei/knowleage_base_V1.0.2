# MCP 网关鉴权/计量提示消息（中文，默认语言）
# 命名与目录沿用平台约定（messages/<bundle>_<locale>.properties），但网关不引 commons-i18n：
# 那个模块会传递 quarkus-rest/rest-qute/hibernate-validator/mapstruct，与网关"依赖最小化"口径冲突。
# 消息要"告诉用户下一步怎么做"，而不只是说失败了。

mcp.auth.missing=未提供 MCP 访问令牌。请在请求头携带 Authorization: Bearer <令牌>，令牌可在平台【MCP 令牌】页面签发。
mcp.auth.invalid=MCP 访问令牌无效（签名校验未通过）。请确认使用的是本平台签发的令牌，必要时到平台【MCP 令牌】页面重新签发。
mcp.auth.expired=MCP 访问令牌已过期。请到平台【MCP 令牌】页面重新签发，并更新 MCP 客户端配置里的 Authorization 头。
mcp.auth.typeMismatch=该令牌不是 MCP 专用令牌（type 应为 mcp）。请到平台【MCP 令牌】页面签发专用令牌，不要复用登录令牌。
mcp.auth.claimsMissing=MCP 访问令牌缺少必要声明（sub/jti），无法识别身份。请到平台【MCP 令牌】页面重新签发。
mcp.auth.revoked=MCP 访问令牌已被注销。请到平台【MCP 令牌】页面重新签发。
mcp.auth.forbidden=该接口仅限系统管理员（sys_admin）访问。
mcp.auth.backendUnavailable=MCP 鉴权服务暂时不可用（令牌校验或吊销检查失败），请稍后重试；持续失败请联系管理员。
mcp.quota.exceeded=今日 MCP 调用额度已用完（每日上限 {0,number,#} 次调用 / {1,number,#} 字符返回）。额度每日 0 点（北京时间）重置，或请联系管理员调整限额。