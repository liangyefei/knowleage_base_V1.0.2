<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#37474f"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1a56db"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1300" fill="#ffffff"/>
  <text x="30" y="42" font-size="36" font-weight="bold" text-anchor="start" fill="#263238">海思知识库 - 架构图</text>

  <!-- ===== 顶部云：华为云存储/中间件 ===== -->
  <path d="M520,60 C430,60 400,110 440,150 C390,180 430,250 520,250 L1450,250 C1540,250 1580,185 1520,150 C1570,105 1520,55 1440,60 C1420,20 1300,10 1250,50 C1200,10 1080,10 1040,55 C980,15 850,20 820,60 C760,30 620,30 600,70 C580,45 550,50 520,60 Z"
        fill="#eef4fb" stroke="#607d8b" stroke-width="2"/>
  <text x="985" y="100" font-size="26" font-weight="bold" text-anchor="middle" fill="#455a64">华为云存储/中间件</text>
  <rect x="530" y="130" width="160" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="610" y="177" font-size="20" text-anchor="middle" fill="#37474f">SFS</text>
  <rect x="720" y="130" width="170" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="805" y="165" font-size="20" text-anchor="middle" fill="#37474f">RDS for</text>
  <text x="805" y="189" font-size="20" text-anchor="middle" fill="#37474f">PostgreSQL</text>
  <rect x="920" y="130" width="150" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="995" y="177" font-size="20" text-anchor="middle" fill="#37474f">DCS（Redis）</text>
  <rect x="1100" y="130" width="150" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="1175" y="177" font-size="20" text-anchor="middle" fill="#37474f">LTS（日志）</text>
  <rect x="1280" y="130" width="180" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="1370" y="165" font-size="20" text-anchor="middle" fill="#37474f">Kafka（DMS）</text>

  <!-- ===== 左侧入口 ===== -->
  <rect x="30" y="240" width="150" height="70" rx="10" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="105" y="282" font-size="23" text-anchor="middle" fill="#263238">用户</text>
  <rect x="30" y="700" width="150" height="70" rx="10" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="105" y="742" font-size="23" text-anchor="middle" fill="#263238">agent</text>
  <rect x="215" y="225" width="160" height="100" rx="12" fill="#f4f7fa" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="295" y="248" font-size="18" text-anchor="middle" fill="#607d8b">华为云</text>
  <rect x="230" y="260" width="130" height="55" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="295" y="294" font-size="21" text-anchor="middle" fill="#263238">WAF</text>
  <rect x="230" y="700" width="130" height="70" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="295" y="742" font-size="21" text-anchor="middle" fill="#263238">APIG</text>

  <!-- 用户 -> WAF -> APIG -->
  <path d="M180,275 L230,275" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M295,315 L295,700" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="352" font-size="17" fill="#455a64">WAF → APIG</text>
  <text x="380" y="690" font-size="16" fill="#455a64">APIG 绑定公网入口，TLS 终止</text>

  <!-- agent -> WAF -> APIG（蓝） -->
  <path d="M180,735 L205,735 L205,287 L226,287" fill="none" stroke="#1a56db" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="150" y="560" font-size="17" fill="#1a56db">agent → WAF</text>

  <!-- ===== 主框：海思知识库 ===== -->
  <rect x="380" y="400" width="1150" height="560" rx="14" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="955" y="432" font-size="29" font-weight="bold" text-anchor="middle" fill="#37474f">海思知识库</text>

  <rect x="430" y="470" width="150" height="80" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="505" y="517" font-size="21" text-anchor="middle" fill="#0d47a1">前端服务</text>
  <rect x="650" y="470" width="220" height="90" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="760" y="505" font-size="21" text-anchor="middle" fill="#0d47a1">后端服务</text>
  <text x="760" y="530" font-size="17" text-anchor="middle" fill="#546e7a">鉴权 / 知识库管理</text>
  <rect x="950" y="470" width="200" height="90" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="1050" y="505" font-size="21" text-anchor="middle" fill="#0d47a1">模型服务</text>
  <text x="1050" y="530" font-size="17" text-anchor="middle" fill="#546e7a">切片 / 向量化</text>
  <rect x="520" y="750" width="180" height="80" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="610" y="797" font-size="21" text-anchor="middle" fill="#0d47a1">MCP服务</text>
  <rect x="950" y="850" width="200" height="80" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="1050" y="897" font-size="21" text-anchor="middle" fill="#0d47a1">Milvus集群</text>
  <rect x="1600" y="470" width="170" height="80" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="1685" y="517" font-size="21" text-anchor="middle" fill="#263238">商业模型</text>

  <!-- 主链路 -->
  <path d="M580,510 L650,510" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M870,510 L950,510" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M1150,500 L1600,500" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1250" y="492" font-size="17" fill="#455a64">问答推理（REST / SSE）</text>

  <!-- ELB（APIG 经 ELB 的 Service 与 CCE 服务互联） -->
  <rect x="395" y="700" width="120" height="60" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="455" y="726" font-size="20" text-anchor="middle" fill="#263238">ELB</text>
  <text x="455" y="748" font-size="14" text-anchor="middle" fill="#546e7a">HTTP</text>

  <!-- ELB -> 前端服务 -->
  <path d="M360,715 L391,715" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M455,700 L455,554" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="462" y="600" font-size="16" fill="#455a64">HTTP（绑定ELB的Service）</text>

  <!-- ===== 蓝色鉴权链路：APIG 自定义鉴权 -> 后端服务 ===== -->
  <!-- APIG -> 后端：自定义鉴权 -->
  <path d="M340,700 L340,448 L680,448 L680,466" fill="none" stroke="#1a56db" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="420" y="440" font-size="17" fill="#1a56db">自定义鉴权</text>
  <!-- 后端 -> APIG：鉴权通过，放行 -->
  <path d="M730,560 L730,640 L300,640 L300,696" fill="none" stroke="#1a56db" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="400" y="632" font-size="17" fill="#1a56db">鉴权通过，放行</text>
  <!-- 放行后：ELB -> MCP服务（蓝） -->
  <path d="M455,760 L455,790 L516,790" fill="none" stroke="#1a56db" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <!-- MCP -> agent：提供服务 -->
  <path d="M610,830 L610,1000 L105,1000 L105,770" fill="none" stroke="#1a56db" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrBlue)"/>
  <text x="300" y="992" font-size="17" fill="#1a56db">鉴权通过后对外提供 MCP 服务能力</text>

  <!-- ===== 后端服务 ↔ Kafka 双向异步 ===== -->
  <!-- 后端/模型服务 -> SFS / RDS / DCS / LTS / Kafka（共用干线） -->
  <path d="M760,470 L760,385" fill="none" stroke="#37474f" stroke-width="2"/>
  <path d="M1100,470 L1100,385" fill="none" stroke="#37474f" stroke-width="2"/>
  <path d="M610,385 L1370,385" fill="none" stroke="#37474f" stroke-width="2"/>
  <path d="M610,385 L610,214" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M805,385 L805,214" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M995,385 L995,214" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M1175,385 L1175,214" fill="none" stroke="#37474f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <path d="M1370,385 L1370,214" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="880" y="376" font-size="17" fill="#455a64">后端 / 模型服务 → SFS / RDS / DCS / LTS / Kafka</text>

  <!-- 模型服务 -> Milvus -->
  <path d="M1050,560 L1050,850" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1062" y="700" font-size="17" fill="#455a64">向量读写</text>

  <!-- 模型服务 -> GES -->
  <path d="M1150,545 L1545,545 L1545,900 L1576,900" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1250" y="537" font-size="17" fill="#455a64">知识图谱持久化</text>

  <!-- ===== 右下华为云框 ===== -->
  <rect x="1560" y="700" width="230" height="250" rx="12" fill="#f1f5f0" stroke="#6b8e23" stroke-width="2"/>
  <text x="1675" y="728" font-size="21" font-weight="bold" text-anchor="middle" fill="#4a6119">华为云</text>
  <rect x="1580" y="745" width="190" height="80" rx="8" fill="#ffffff" stroke="#6b8e23" stroke-width="1.5"/>
  <text x="1675" y="780" font-size="18" text-anchor="middle" fill="#33691e">reranker&amp;LLM服务</text>
  <rect x="1580" y="860" width="190" height="80" rx="8" fill="#ffffff" stroke="#6b8e23" stroke-width="1.5"/>
  <text x="1675" y="907" font-size="20" text-anchor="middle" fill="#33691e">GES</text>

  <!-- 图例 -->
  <rect x="1600" y="1090" width="180" height="120" rx="8" fill="#fafafa" stroke="#b0bec5" stroke-width="1"/>
  <text x="1615" y="1115" font-size="18" font-weight="bold" fill="#455a64">图例</text>
  <path d="M1615,1135 L1675,1135" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1685" y="1140" font-size="16" fill="#455a64">同步调用/读写</text>
  <path d="M1615,1162 L1675,1162" stroke="#1a56db" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="1685" y="1167" font-size="16" fill="#455a64">agent 鉴权链路</text>
  <path d="M1615,1189 L1675,1189" stroke="#37474f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1685" y="1194" font-size="16" fill="#455a64">异步/日志</text>
</svg>
